<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <link rel="stylesheet" href="./style.css" />

    <!-- Tailwind and daisy UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--font-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div
      class="navbar bg-base-100 shadow-sm pr-0 flex items-center justify-between"
    >
      <div class="flex-1">
        <div class="flex-1 flex gap-2 items-center sm:ml-2 md:ml-7">
          <img class="w-9 h-auto" src="./assets/github-logo.png" alt="" />
          <h3 class="font-semibold text-[14px] md:text-xl text-[#1F2937]">
            GitHub Issues Tracker
          </h3>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-circle md:hidden">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </button>
        
        <input id="input-search"
          type="text"
          placeholder="Search"
          class="input input-bordered w-24 md:w-auto hidden lg:block"
        />
        <div id="btn-search" class="navbar-end ml-auto mr-2 md:mr-7">
          <a class="btn bg-[#4A00FF] text-white"
            ><i class="fa-solid fa-plus"></i>Button</a
          >
        </div>
      </div>
    </div>

    <section class="w-10/12 mx-auto mt-14 flex gap-2 p-3 shadow-sm">
      <button id="all-btn" class="btn btn1 bg-[#4A00FF] text-white">All</button>
      <button id="opened-btn" class="btn btn1">Opened</button>
      <button id="closed-btn" class="btn btn1">Closed</button>
    </section>

    <section class="w-10/12 shadow-sm mx-auto flex justify-between p-3 mt-3">
      <div class="flex items-center gap-2">
        <div class="img bg-purple-100 p-2 rounded-full">
          <img src="./assets/Aperture.png" alt="" />
        </div>
        <div>
          <p class="font-bold">50 Issues</p>
          <p class="sm:tex-[10px] md:text-lg">
            Track and manage your project issues
          </p>
        </div>
      </div>

      <div
        class="flex flex-col justify-center md:flex md:flex-row items-center gap-4"
      >
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 bg-green-500 rounded-full"></span>
          <span>Open</span>
        </div>

        <div class="flex items-center gap-1">
          <span class="w-2 h-2 bg-purple-500 rounded-full"></span>
          <span>Closed</span>
        </div>
      </div>
    </section>

    <!-- Spinner -->
    <section id="spinner" class="flex justify-center items-center py-10 hidden">
      <span class="loading loading-bars loading-xl"></span>
    </section>
    
    
    
    
      <section
      id="issues-container"
      class="p-3 shadow-md w-10/12 mx-auto grid md:grid-cols-2 lg:grid-cols-4 gap-3"
    ></section>

    <!-- Modal -->

    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
      <div class="modal-box">
        <div id="modalContainer"></div>
        <div class="modal-action">
          <form method="dialog">
            <!-- if there is a button in form, it will close the modal -->
            <button class="btn">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="./script/home.js"></script>
  </body>
</html>
